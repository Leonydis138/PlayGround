name: Weekly Allocator + Analytics refresh

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # the loop commits data + dashboard back to main
    concurrency:
      group: weekly-refresh # never two overlapping refresh/commit runs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Repo consistency verify (fails the job on drift)
        run: node scripts/verify.mjs
      - name: Internal link check (fails the job on broken links)
        run: node scripts/link-check.mjs
      - name: Content quality gate (fails the job on thin/scaffolded content)
        run: node scripts/lint-content.mjs
      - name: Autonomy gate (executes SAFE-class queue items, level from data.json)
        run: node scripts/autonomy.mjs
      - name: Ledger summary (Accountant prep - numbers only, never advice)
        run: node scripts/ledger-summary.mjs
      - name: Pull analytics (GSC + Cloudflare) - dry mode until secrets set
        env:
          GSC_JSON_KEY: ${{ secrets.GSC_JSON_KEY }}
          GSC_SITE_BRANCH_A: ${{ secrets.GSC_SITE_BRANCH_A }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_SITE_TAG: ${{ secrets.CF_SITE_TAG }}
        run: node scripts/pull-analytics.mjs
      - name: Cluster scoring (Branch B internal loop)
        run: node scripts/cluster-score.mjs
      - name: Branch allocation scoring
        run: node scripts/allocator.mjs
      - name: Regenerate sitemaps + robots.txt
        run: node scripts/build-sitemaps.mjs
      - name: Rebuild dashboard dist (data.json refresh)
        run: node scripts/build-dashboard.mjs
      - name: Backup bundle (disaster recovery, single file)
        run: node scripts/backup.mjs
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with: { name: vantage-backup, path: backup/, retention-days: 90 }
      - name: Commit updated data + dashboard
        run: |
          git config user.name "vantage-bot"
          git config user.email "actions@github.com"
          git add data/ dashboard/dist/ sites/ || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: weekly data refresh"
          # A rejected push must not silently succeed. Retry once (the CEO may
          # have committed in the same window), then fail loudly so the
          # refreshed state is never lost without anyone noticing.
          git push || {
            echo "::warning::push rejected - rebasing once onto origin/main"
            git pull --rebase --autostash origin main && git push
          }